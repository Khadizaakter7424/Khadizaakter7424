<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a22"/>
    </linearGradient>
    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a232c"/>
      <stop offset="100%" stop-color="#151d24"/>
    </linearGradient>
    <clipPath id="roundedCorners">
      <rect x="0" y="0" width="1200" height="320" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="320" fill="url(#bgGrad)"/>

    <!-- Top bar -->
    <rect x="0" y="0" width="1200" height="48" fill="url(#topbarGrad)"/>
    <circle cx="30" cy="24" r="8" fill="#ff5f56"/>
    <circle cx="56" cy="24" r="8" fill="#ffbd2e"/>
    <circle cx="82" cy="24" r="8" fill="#27c93f"/>
    <text x="600" y="30" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#8b949e" text-anchor="middle">khadiza@dev: ~/portfolio</text>

    <!-- Bottom accent strip (matches her palette) -->
    <rect x="0" y="312" width="1200" height="8" fill="#e7c9a3"/>

    <!-- Terminal body text -->
    <g font-family="DejaVu Sans Mono, monospace" font-size="22">
      <text x="40" y="95"  fill="#2f7488">$ <tspan fill="#e6edf3">whoami</tspan></text>
      <text x="40" y="130" fill="#e7c9a3">&gt; Khadiza Akter</text>

      <text x="40" y="170" fill="#2f7488">$ <tspan fill="#e6edf3">role --show</tspan></text>
      <text x="40" y="205" fill="#e7c9a3">&gt; Aspiring .NET Developer</text>

      <text x="40" y="245" fill="#2f7488">$ <tspan fill="#e6edf3">tech --stack</tspan></text>
      <text x="40" y="280" fill="#e7c9a3">
        &gt; C# · ASP.NET Core · Entity Framework · SQL Server · jQuery
        <tspan fill="#e6edf3">▍</tspan>
      </text>

      <!-- Blinking cursor -->
      <rect x="850" y="262" width="14" height="24" fill="#e7c9a3">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
